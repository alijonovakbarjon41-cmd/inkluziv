<style>

*{box-sizing:border-box}html{font-size:var(--fs);height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",system-ui,sans-serif;line-height:1.7;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

header{position:sticky;top:0;z-index:9;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px clamp(12px,3vw,32px);background:var(--cd);border-bottom:1px solid var(--bd)}

.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.tabs button.on{background:var(--p);color:#fff;border-color:var(--p)}

.op{display:grid;gap:8px;margin-top:10px}.op button{text-align:left}.op .ok{background:var(--g);color:#000;border-color:var(--g)}.op .no{background:var(--r);color:#fff;border-color:var(--r)}
.cs{font-size:1.1rem;font-weight:600;min-height:56px}

<script>
const F=[`https://forms.gle/VNRtDyKCnDg69kX1A`,`https://forms.gle/j9k6p3nWJcLNsKfp9`,`https://forms.gle/rgueSS9m96CstX9a8`,`https://forms.gle/za7yHf5ZmUEKrKEeA`,`https://forms.gle/bnhywBodNubUsS5Y8`];
/* Format: t=sarlavha; s=[[bo'lim,matn]]; w=[[termin,ta'rif]]; q=[[tasdiq,1 haqiqat|0 yolg'on]]; z=[[savol,TO'G'RI javob,noto'g'ri1,noto'g'ri2]] */
const T=[
{t:`Inklyuziv ta'lim: asosiy tushuncha va tamoyillar`,
s:[[`Inklyuziya nima?`,`Inklyuziv ta'lim - maxsus ta'lim ehtiyojlari bo'lgan bolalar ham tengdoshlari bilan birga umumta'lim muassasasida, o'z ehtiyojiga mos qo'llab-quvvatlash bilan o'qishini nazarda tutadi. Asosiy g'oya: <b>bola tizimga moslashmaydi, tizim har bir bolaning ehtiyojiga moslashadi.</b> Inklyuziya faqat nogironligi bo'lgan bolalarga tegishli emas: tili, madaniyati, sog'lig'i yoki ijtimoiy ahvoli tufayli ta'limdan chetda qolish xavfi bor barcha bolalarni qamrab oladi.`],
[`Segregatsiya, integratsiya, inklyuziya`,`<b>Segregatsiya</b> - maxsus ehtiyojli bolalar umumiy tizimdan alohida muassasalarda o'qitiladi. <b>Integratsiya</b> - bola oddiy sinfga joylashtiriladi, lekin muhit o'zgarmaydi va bolaning o'zi moslashishi kutiladi. <b>Inklyuziya</b> - muhit, o'quv dasturi, o'qitish va baholash usullari barcha o'quvchilarning xilma-xilligini hisobga olib qayta loyihalanadi.`],
[`Asosiy tamoyillar`,`Tenglik va kamsitmaslik; har bir shaxsning qadr-qimmati; ta'lim jarayonida to'laqonli ishtirok; individual yondashuv; muhitning qulayligi (jismoniy, axborot va metodik); o'qituvchi, oila va mutaxassislar hamkorligi; bolaning kuchli tomonlariga tayanish.`],
[`Xalqaro hujjatlar xronologiyasi`,`1990-yil, Jomtien (Tailand): «Hamma uchun ta'lim» butunjahon deklaratsiyasi. 1994-yil, Salamanka (Ispaniya): maxsus ta'lim ehtiyojlari bo'yicha UNESCO konferensiyasi; Salamanka bayonoti inklyuziv maktab g'oyasini xalqaro darajada mustahkamladi. 2006-yil: BMTning Nogironlar huquqlari to'g'risidagi konvensiyasi qabul qilindi, 24-moddasi ta'limga bag'ishlangan. 2015-yil: Barqaror rivojlanish maqsadlarining 4-maqsadi - inklyuziv, teng va sifatli ta'lim.`],
[`O'zbekistonda`,`O'zbekiston Nogironlar huquqlari to'g'risidagi konvensiyani 2009-yilda imzolagan va 2021-yilda ratifikatsiya qilgan. 2020-yilda qabul qilingan yangi tahrirdagi «Ta'lim to'g'risida»gi qonunda inklyuziv ta'lim tushunchasi va uni tashkil etish asoslari belgilangan. Amaldagi me'yoriy hujjatlarning so'nggi tahrirlarini lex.uz milliy bazasidan tekshirish tavsiya etiladi.`]],
w:[[`Inklyuziya`,`Muhit barcha o'quvchilarning ehtiyojiga moslashadigan, hamma birga o'qiydigan model`],[`Integratsiya`,`Bola umumiy sinfda, lekin undan moslashish kutiladi`],[`Segregatsiya`,`Bolalarning alohida muassasalarda ajratib o'qitilishi`],[`Qulaylik`,`Jismoniy, axborot va metodik jihatdan hamma uchun mavjudlik`]],
q:[[`Inklyuziyada bola mavjud tizimga to'liq moslashishi shart.`,0],[`Salamanka bayonoti 1994-yilda qabul qilingan.`,1],[`Inklyuziya faqat nogironligi bo'lgan bolalarga tegishli.`,0],[`BMT Konvensiyasining 24-moddasi ta'limga bag'ishlangan.`,1],[`O'zbekiston Konvensiyani 2021-yilda ratifikatsiya qilgan.`,1]],
z:[[`Inklyuziyaning asosiy g'oyasi qaysi?`,`Tizim bolaning ehtiyojiga moslashadi`,`Bola tizimga moslashadi`,`Bolalar ajratib o'qitiladi`],[`Salamanka bayonoti qaysi yilda qabul qilingan?`,`1994`,`1990`,`2006`],[`O'zbekiston Konvensiyani qachon ratifikatsiya qilgan?`,`2021`,`2009`,`2015`]]},
{t:`Xorijiy davlatlar va O'zbekistonda kasb-hunar ta'limi inklyuziv amaliyotining xususiyatlari`,
s:[[`Kasb-hunar ta'limining o'rni`,`Maktabdan keyingi bosqichda asosiy masala - yoshning mehnat bozoriga kirishi va mustaqil hayot kechirishi. Shu sababli inklyuziv kasb-hunar ta'limida amaliyot, ish joyiga moslashish va ishga joylashtirish nazariy bilimdan kam bo'lmagan ahamiyatga ega.`],
[`Xorijiy yondashuvlar`,`<b>Germaniya:</b> nazariy o'qish korxonadagi amaliyot bilan uyg'unlashgan ikki tomonlama (dual) tizim; nogironligi bor yoshlar uchun maxsus kasbiy ta'lim markazlari (Berufsbildungswerke) ham mavjud. <b>Finlyandiya:</b> kasbiy ta'limda har bir o'quvchi uchun shaxsiy kompetensiyani rivojlantirish rejasi (HOKS) tuziladi. <b>AQSh:</b> «qo'llab-quvvatlanadigan bandlik» modelida ish joyida mutaxassis-murabbiy (job coach) xodimga yordam beradi.`],
[`Umumiy xususiyatlar`,`Samarali tizimlarda quyidagilar uchraydi: kasbga erta yo'naltirish; ish beruvchilar bilan yaqin hamkorlik; ish joyida yordamchi-murabbiy; moslashtirilgan baholash; bitiruvchini ishga joylashgandan keyin ham kuzatish.`],
[`O'zbekistonda`,`Kasb-hunar ta'limi texnikum, kollej va kasb-hunar maktablari orqali beriladi. Inklyuziv amaliyotning asosiy yo'nalishlari: imkoniyatga mos kasbni tanlash, o'quv xonalari va ustaxonalarni moslashtirish, psixolog va pedagog yordami, ishlab chiqarish amaliyotini tashkil etish. Aniq me'yoriy talablar o'zgarib turadi, shuning uchun ilmiy ishda amaldagi hujjatlarga tayaning.`],
[`Muammoli jihatlar`,`Kasblar tanlovining cheklanishi, ish beruvchilarning tayyor emasligi, ustozlarning maxsus tayyorgarligi yetishmasligi va jamiyatdagi stereotiplar.`]],
w:[[`Dual tizim`,`Nazariy o'qishni korxonadagi amaliyot bilan birlashtiruvchi model`],[`Job coach`,`Ish joyida xodimga yordam beruvchi murabbiy`],[`HOKS`,`Finlyandiyada kasbiy ta'limdagi shaxsiy kompetensiya rejasi`],[`Moslashtirish`,`Ish joyi yoki o'quv muhitini shaxs imkoniyatiga keltirish`]],
q:[[`Job coach ish joyida yordam beradi.`,1],[`Finlyandiyada kasbiy ta'limda shaxsiy reja tuziladi.`,1],[`Inklyuziya diplom olish bilan tugaydi.`,0],[`Dual tizimda faqat nazariy dars beriladi.`,0]],
z:[[`Dual tizim nima?`,`Nazariya va korxona amaliyotining uyg'unligi`,`Faqat masofaviy o'qish`,`Ikki xil diplom berish`],[`Job coach kim?`,`Ish joyidagi yordamchi-murabbiy`,`Maktab direktori`,`Imtihon nazoratchisi`],[`HOKS qaysi davlatda qo'llanadi?`,`Finlyandiya`,`Germaniya`,`AQSh`]]},
{t:`Inklyuziyadagi qiyinchiliklar va to'siqlar`,
s:[[`To'siqlar tasnifi`,`To'siqlar quyidagi guruhlarga bo'linadi: <b>huquqiy-tashkiliy</b> (mexanizmlar va yo'riqnomalarning yetarli emasligi), <b>jismoniy</b> (zinapoyalar, tor eshiklar, moslashtirilmagan hojatxona), <b>axborot</b> (Brayl, ishora tili va oson o'qiladigan matnlarning yo'qligi), <b>metodik</b>, <b>kadrlar</b>, <b>moliyaviy</b> va <b>ijtimoiy-psixologik</b> to'siqlar.`],
[`Munosabat bilan bog'liq to'siqlar`,`Binoga pandus o'rnatish mumkin, ammo stereotiplarni faqat qurilish bilan bartaraf etib bo'lmaydi. «Bunday bola oddiy sinfda o'qiy olmaydi» kabi qarashlar ijtimoiy-psixologik to'siqning ko'rinishidir. Ota-onalar ham ba'zan bolaning ajratib qo'yilishidan, ba'zan aksincha, maxsus muassasaning himoyasini yo'qotishdan xavotirlanadi.`],
[`Kadr va metodik muammolar`,`Umumta'lim o'qituvchisi ko'pincha katta sinf, qat'iy dastur va vaqt cheklovi sharoitida ishlaydi. Tyutor va maxsus pedagoglar yetarli bo'lmasa, individual yondashuv amalda qiyin kechadi.`],
[`Hisobga olinmagan bolalar muammosi`,`Rasmiy statistika faqat ro'yxatga olingan va tibbiy-pedagogik komissiyadan o'tgan bolalarni aks ettiradi. Tashxis qo'yilmagan, komissiyaga murojaat qilmagan yoki uyda o'qitilayotgan bolalar hisobga tushmay qolishi mumkin. Bunday bolalar ta'lim muassasasiga ham, yordam tizimiga ham kirmaydi, shu sababli ularning ehtiyojini rejalashtirish qiyinlashadi. Bu hodisa ta'lim siyosatida «hisobga olinmaganlik» muammosi deb yuritiladi.`],
[`Yechim yo'nalishlari`,`O'qituvchilarni tayyorlash; tyutor va logoped xizmatini kengaytirish; binolarni bosqichma-bosqich qulaylashtirish; ota-onalar bilan ochiq muloqot; samarali amaliyotlarni tarqatish; monitoring va yagona ma'lumotlar bazasini yuritish.`]],
w:[[`To'siq`,`Ishtirokni cheklaydigan har qanday omil`],[`Stereotip`,`Ijtimoiy guruh haqidagi soddalashtirilgan, ko'pincha noto'g'ri tasavvur`],[`Tyutor`,`O'quvchiga sinfda yordam beruvchi mutaxassis`],[`Universal foyda`,`Moslashtirish hamma uchun qulaylik yaratishi`]],
q:[[`Faqat binoni qulaylashtirish inklyuziyani to'liq ta'minlaydi.`,0],[`Stereotiplar ijtimoiy-psixologik to'siqqa kiradi.`,1],[`Rasmiy statistika barcha bolalarni to'liq qamrab oladi.`,0],[`Pandus faqat nogironligi bor shaxslarga foydali.`,0]],
z:[[`Quyidagilardan qaysi biri ijtimoiy-psixologik to'siq?`,`Stereotip va salbiy munosabat`,`Eshik kengligi`,`Zinapoya`],[`Tyutor kim?`,`Sinfda o'quvchiga yordam beruvchi mutaxassis`,`Maktab nazoratchisi`,`Sinf rahbari`],[`Hisobga olinmagan bolalar muammosi nimada?`,`Ular rasmiy statistikada aks etmaydi`,`Ular haddan ziyod ko'p`,`Ular maxsus maktabda o'qiydi`]]},
{t:`Inklyuziv ta'limning pedagogik texnologiyalari`,
s:[[`Universal dizayn (UDL)`,`Ta'limda universal dizayn (UDL) - CAST tashkiloti ishlab chiqqan yondashuv bo'lib, dars boshidan xilma-xil o'quvchilarni hisobga olib loyihalanadi. Uch tamoyil: <b>(1) ma'lumotni turli shakllarda taqdim etish</b>; <b>(2) harakat va ifoda usullarini ko'paytirish</b> (yozma, og'zaki, loyiha); <b>(3) o'quvchini jalb etish va motivatsiyalash usullarini xilma-xil qilish.</b>`],
[`Differensiatsiya va individual dastur`,`Differensiatsiyada o'qituvchi mazmun, jarayon va natija shaklini o'quvchining tayyorgarligi va ehtiyojiga qarab moslaydi. Individual ta'lim dasturi (IEP) bola uchun maqsadlar, qo'llab-quvvatlash turlari va baholash mezonlarini yozma belgilaydi; uni o'qituvchi, mutaxassislar va ota-ona birgalikda ishlab chiqadi.`],
[`Hamkorlikda o'qitish`,`Kichik guruhlarda rollari aniq belgilangan ish, tengdoshlar o'rtasida o'zaro o'qitish va «juftlikda fikrlash va bo'lishish» usuli o'quvchilarning ijtimoiy ko'nikmalarini va o'zlashtirishini birga rivojlantiradi.`],
[`Bosqichma-bosqich qo'llab-quvvatlash (scaffolding)`,`Atama Vud, Bruner va Ross (1976) nomi bilan bog'liq: murakkab vazifa kichik qadamlarga bo'linadi va yordam asta-sekin kamaytiriladi. Nazariy asosi - L. S. Vygotskiyning «yaqin rivojlanish zonasi» tushunchasi: bola mustaqil bajara olmaydigan, ammo kattalar yoki tengdoshi yordamida uddalaydigan vazifa rivojlanishni eng ko'p ta'minlaydi.`],
[`Vositalar va usullar`,`Vizual jadvallar, ko'p sezgili (ko'rish, eshitish, harakat) usullar, formativ baholash, yordamchi texnologiyalar (ekran o'quvchi, nutq sintezatori, kattalashtirgich), loyihaviy ta'lim. Muhimi - vositaning o'zi emas, uni o'quv maqsadiga va o'quvchiga mos tanlash.`]],
w:[[`UDL`,`Hamma uchun moslashuvchan dars loyihalash yondashuvi`],[`IEP`,`Individual ta'lim dasturi`],[`Scaffolding`,`Yordamni bosqichma-bosqich beruvchi va kamaytiruvchi usul`],[`Differensiatsiya`,`Mazmun, jarayon va natijani o'quvchiga moslash`]],
q:[[`UDL ma'lumotni faqat bir shaklda taqdim etishni nazarda tutadi.`,0],[`IEP ota-ona ishtirokida tuzilishi tavsiya etiladi.`,1],[`Scaffolding yordamni bosqichma-bosqich kamaytirishni nazarda tutadi.`,1],[`Differensiatsiya barcha o'quvchilarga bir xil topshiriq berishdir.`,0]],
z:[[`UDL nechta asosiy tamoyilga tayanadi?`,`3`,`2`,`7`],[`IEP nima?`,`Individual ta'lim dasturi`,`Imtihon turi`,`Dars jadvali`],[`«Yaqin rivojlanish zonasi» nazariyasi muallifi kim?`,`L. S. Vygotskiy`,`Dj. Dyui`,`B. Skinner`]]},
{t:`Inklyuziv ta'lim uchun pedagog kadrlar tayyorlashning o'ziga xos xususiyatlari`,
s:[[`Kimlar ishtirok etadi?`,`Inklyuziya ikki guruh mutaxassisga tayanadi: <b>umumta'lim o'qituvchisi</b> va <b>maxsus pedagog</b> (surdopedagog, tiflopedagog, oligofrenopedagog, logoped, maxsus psixolog, tyutor). Natija ular jamoa bo'lib ishlaganda yuqori bo'ladi: biri o'quv dasturini, ikkinchisi moslashtirish usullarini yaxshi biladi.`],
[`Zarur kompetensiyalar`,`Bilim: rivojlanish xususiyatlari va ehtiyoj turlari haqida asosiy tushunchalar. Ko'nikma: darsni moslashtirish, IEP tuzish, kuzatuv va formativ baholash, yordamchi texnologiyalardan foydalanish. Munosabat: har bir bolaning o'rgana olishiga ishonch va hurmat.`],
[`Tayyorlash modellari`,`Xalqaro amaliyotda uch yo'nalish uchraydi: (1) barcha pedagogik yo'nalishlarga inklyuziya moduli kiritish; (2) maxsus pedagogika ixtisosligi; (3) malaka oshirish va doimiy mentorlik. Eng muhim jihat - amaliyot: inklyuziv sinfda kuzatish, mentor bilan ishlash, reflektiv kundalik yuritish.`],
[`O'zbekistonda`,`Inklyuziv ta'lim joriy qilinayotgan muassasalarda maxsus pedagoglar faoliyat yuritadi, o'qituvchilar uchun malaka oshirish kurslari va seminar-treninglar o'tkaziladi. Mutaxassislar soni va aniq ko'rsatkichlar har yili o'zgarishi sababli ularni Xalq ta'limi vazirligining so'nggi rasmiy ma'lumotlaridan olish lozim.`],
[`Rivojlanish yo'nalishlari`,`Pedagogika oliy ta'lim muassasalarida inklyuziya fanlarini kuchaytirish; mentor-o'qituvchilar tarmog'i; hududiy resurs markazlari; o'qituvchilarning psixologik qo'llab-quvvatlanishi va mehnatini rag'batlantirish.`]],
w:[[`Defektolog`,`Rivojlanish xususiyatlari bilan ishlovchi maxsus pedagog`],[`Logoped`,`Nutq buzilishlarini tuzatuvchi mutaxassis`],[`Mentor`,`Yangi o'qituvchiga yo'l-yo'riq beruvchi tajribali hamkasb`],[`Reflektiv kundalik`,`Dars tahlilini yozib borish amaliyoti`]],
q:[[`Inklyuziyada umumta'lim o'qituvchisi va maxsus pedagog hamkorlik qiladi.`,1],[`Pedagog tayyorlashda amaliyot ahamiyatga ega emas.`,0],[`Mentorlik pedagog kadrlar tayyorlash usullaridan biri.`,1],[`Inklyuziyada tyutor yoki maxsus pedagogga ehtiyoj yo'q.`,0]],
z:[[`Nutq buzilishlari bilan qaysi mutaxassis ishlaydi?`,`Logoped`,`Tarixchi`,`Muhandis`],[`Pedagog tayyorlashning samarali yo'li qaysi?`,`Nazariya, amaliyot va mentorlikning uyg'unligi`,`Faqat ma'ruza`,`Faqat test`],[`Reflektiv kundalik nima?`,`Dars haqidagi yozma tahlil`,`Baholash jadvali`,`Sinf ro'yxati`]]},

E(`Inklyuziv ta'limning huquqiy asoslari: BMT va xalqaro hujjatlar`,
[[`Asosiy hujjatlar`,`Inson huquqlari umumjahon deklaratsiyasi (1948) ta'lim huquqini e'tirof etadi (26-modda). Bola huquqlari to'g'risidagi konvensiya (1989) har bir bolaning kamsitilmasdan ta'lim olish huquqini mustahkamlaydi. Nogironlar huquqlari to'g'risidagi konvensiya (BMT, 2006) 24-moddasida davlatlarning har bir bosqichda inklyuziv ta'lim tizimini ta'minlash majburiyatini belgilaydi.`],[`Siyosiy deklaratsiyalar`,`Jomtien (1990) va Dakar (2000) «Hamma uchun ta'lim» harakatini, Salamanka bayonoti (1994) inklyuziv maktab tamoyilini, Incheon deklaratsiyasi (2015) esa Barqaror rivojlanish maqsadlari doirasida 4-maqsadni belgiladi. Bayonot va deklaratsiyalar tavsiyaviy kuchga ega, konvensiyalar esa ratifikatsiya qilgan davlatlar uchun majburiydir.`]],

E(`O'zbekiston qonunchiligi va davlat siyosati`,
[[`Milliy huquqiy asoslar`,`O'zbekiston Respublikasi Konstitutsiyasi ta'lim olish huquqini kafolatlaydi. 2020-yilda yangi tahrirdagi «Ta'lim to'g'risida»gi qonun qabul qilindi va unda inklyuziv ta'lim tushunchasi hamda uni tashkil etish asoslari aks etgan. Shuningdek, nogironligi bo'lgan shaxslarning huquqlarini himoya qiluvchi alohida qonunchilik mavjud. O'zbekiston Nogironlar huquqlari konvensiyasini 2009-yilda imzolagan, 2021-yilda ratifikatsiya qilgan.`],[`Amaliy mexanizmlar`,`Tizimda umumta'lim muassasalarida inklyuziv sinflarni tashkil etish, tibbiy-psixologik-pedagogik tekshiruv, maxsus pedagoglar va tyutorlar jalb etish, uyda va masofaviy ta'lim shakllari qo'llanadi. Me'yoriy hujjatlar tez-tez yangilanadi, shuning uchun ularning amaldagi tahririni lex.uz saytidan tekshirish zarur.`]],

[[`Ehtiyoj va tashxis`,`Maxsus ta'lim ehtiyojlari - bolaning ta'lim olishi uchun qo'shimcha yordam, moslashtirish yoki maxsus usullar talab etilishi. Bu tushuncha tashxisdan ko'ra bolaga qanday yordam kerakligiga qaratilgan. Bir xil tashxisli bolalarning ehtiyojlari turlicha bo'lishi mumkin.`],[`Asosiy guruhlar`,`Ko'rishida, eshitishida, tayanch-harakat tizimida, intellektual rivojlanishida, nutqida muammolar; autizm spektri; e'tibor va xulq-atvor bilan bog'liq qiyinchiliklar; o'quv ko'nikmalarining maxsus buzilishlari; murakkab (bir necha) buzilishlar. Iqtidorli bolalar ham alohida ta'lim ehtiyojiga ega.`]],

[[`Xususiyatlari`,`Ko'rish nuqsoni to'liq ko'rmaslikdan tortib, ko'rish o'tkirligi yoki ko'rish maydonining pasayishigacha bo'lgan holatlarni o'z ichiga oladi. Ko'rishi zaif o'quvchilar odatda kattalashtirilgan matn va yaxshi yoritilishga muhtoj, ko'zi ojiz o'quvchilar esa Brayl yozuvi, audio materiallar va tuyg'u orqali o'rganishga tayanadi.`],[`Amaliy tavsiyalar`,`O'quvchini sinfning yorug' va doska yaqin qismiga o'tqazing; yozganingizni ovoz chiqarib ayting; kontrastli va yirik shriftdan foydalaning; ko'rgazmali materialni og'zaki tasvirlang; sinf jihozlarining joyini keraksiz o'zgartirmang; matnning elektron shaklini taqdim eting.`]],

[[`Xususiyatlari`,`Bu bolalar yangi ma'lumotni sekinroq o'zlashtirishi, mavhum tushunchalarni tushunishda va umumlashtirishda qiyinchilik sezishi mumkin. Daraja turlicha bo'ladi, shuning uchun individual baholash zarur. Ular kuchli tomonlarga va rivojlanish imkoniga ega.`],[`Amaliy tavsiyalar`,`Ko'rsatmani qisqa va aniq bering; murakkab vazifani kichik qadamlarga bo'ling; takrorlashga ko'proq vaqt ajrating; ko'rgazmali va amaliy mashg'ulotlardan foydalaning; kundalik hayot ko'nikmalariga e'tibor qarating; yoshiga mos munosabatni saqlang va bolani kichkina bola kabi muomala qilmang.`]],

[[`Xususiyatlari`,`DEHB (e'tibor tanqisligi va giperaktivlik buzilishi) - e'tiborni jamlash, impulsivlik va harakat faolligi bilan bog'liq nevrologik rivojlanish xususiyati. U irodaning zaifligi yoki noto'g'ri tarbiya natijasi emas. Tashxisni faqat tegishli mutaxassis qo'yadi; o'qituvchi faqat kuzatuv natijalarini bildiradi.`],[`Amaliy tavsiyalar`,`Topshiriqni qisqa bo'laklarga bo'ling; harakatga imkon beruvchi qisqa tanaffuslar kiriting; qoidalarni aniq va oldindan belgilang; tezkor va ijobiy fikr-mulohaza bering; chalg'ituvchi omillarni kamaytiring; bolani ommaviy tanqid qilmang.`]],

[[`Atamalar`,`Bu o'quv ko'nikmalarining maxsus buzilishlaridir: <b>disleksiya</b> - o'qishda, <b>disgrafiya</b> - yozishda, <b>diskalkuliya</b> - hisoblash va raqamlarni tushunishda turg'un qiyinchilik. Ular intellektning pastligi yoki dangasalikdan kelib chiqmaydi: bu bolalarning aqliy qobiliyati o'rtacha yoki yuqori bo'lishi mumkin.`],[`Amaliy tavsiyalar`,`Qo'shimcha vaqt bering; audio materiallar va matnni ovozga aylantiruvchi vositalardan foydalaning; yozma ishlarni kompyuterda bajarishga ruxsat bering; imloviy xatolar uchun ball kamaytirmasdan mazmunni baholang; ko'p sezgili usullar (ko'rish, eshitish, harakat) qo'llang.`]],

E(`Iqtidorli bolalar inklyuzivligi`,
[[`Iqtidorli bola kim?`,`Iqtidorli bolalar bir yoki bir necha sohada tengdoshlaridan sezilarli yuqori qobiliyat ko'rsatadi. Ularga ham mos ta'lim muhiti kerak: mos bo'lmagan yengil topshiriqlar zerikish, motivatsiya pasayishi va xulq muammolariga olib kelishi mumkin. Ba'zi bolalarda iqtidor bilan birga ta'lim qiyinchiliklari ham bo'ladi («ikki karra noyob» bolalar).`],[`Yondashuvlar`,`Boyitish (mazmunni chuqurlashtirish va kengaytirish), tezlashtirish (yuqori sinf materialiga o'tish), loyiha va tadqiqot topshiriqlari, qiziqish bo'yicha guruhlar, mentorlik. Muhim jihat - ijtimoiy-emotsional ehtiyojlarni ham e'tiborsiz qoldirmaslik.`]],

[[`Mohiyati`,`Ijtimoiy-emotsional o'rganish (SEL) - o'quvchilarning hissiyotlarini anglash va boshqarish, boshqalarga hamdard bo'lish, sog'lom munosabat o'rnatish va mas'uliyatli qaror qabul qilish ko'nikmalarini rivojlantirish jarayoni. CASEL tashkiloti besh kompetensiyani ajratadi: o'zini anglash, o'zini boshqarish, ijtimoiy anglash, munosabat ko'nikmalari va mas'uliyatli qaror qabul qilish.`],[`Inklyuziyadagi o'rni`,`SEL o'quvchilar o'rtasidagi o'zaro hurmatni mustahkamlaydi, nizolarni kamaytiradi va maxsus ehtiyojli o'quvchilarning ijtimoiy qabul qilinishiga yordam beradi. U alohida darslarda ham, kundalik sinf faoliyatiga singdirilgan holda ham o'rgatiladi.`]],

[[`Keys-stadi tuzilishi`,`Keys-stadi odatda quyidagi qismlardan iborat: vaziyatning tavsifi (sinf, o'quvchi ehtiyojlari - shaxsiy ma'lumotlar maxfiy saqlangan holda), muammo, qo'llangan choralar, natija va xulosalar. U nazariyani amaliyot bilan bog'laydi va hamkasblar tajribasidan o'rganish imkonini beradi.`],[`Namuna (shartli)`,`<i>Shartli misol:</i> 5-sinfda o'zlashtirishi past, yozishda qiynaladigan o'quvchi uchun o'qituvchi diagnostik kuzatuv o'tkazdi, mutaxassis bilan maslahatlashdi, yozma ishlarni kompyuterda bajarishga va qo'shimcha vaqtga imkon berdi, ota-onani jalb etdi va natijani formativ baholash bilan kuzatdi. Natijada o'quvchining ishtiroki oshdi. Haqiqiy keys tuzishda har bir qadam hujjatlashtirilishi kerak.`]],
[[`Keys-stadi`,`Aniq holatni tahlil qilish usuli`],[`Hujjatlashtirish`,`Jarayonni yozma qayd etish`],[`Yaxshi amaliyot`,`Natijasi isbotlangan, tarqatishga arzigulik tajriba`]],
[[`Keys-stadida shaxsiy ma'lumotlar maxfiy saqlanadi.`,1],[`Keys-stadi faqat muvaffaqiyatsizliklarni yoritadi.`,0],[`Keys natija va xulosalarni o'z ichiga oladi.`,1]],
[[`Keys-stadi nimani o'z ichiga oladi?`,`Holat, choralar, natija`,`Faqat baho`,`Faqat rasm`],[`Maxfiylik nimani anglatadi?`,`Shaxsni aniqlatmaslik`,`Ochiq e'lon`,`Reklama`],[`Yaxshi amaliyot nima?`,`Isbotlangan samarali tajriba`,`Tasodifiy harakat`,`Bir martalik hodisa`]]),
E(`O'zbekistonda inklyuziv ta'limning rivojlanish istiqbollari`,
[[`Ustuvor yo'nalishlar`,`Rivojlanish uchun quyidagi yo'nalishlar muhim: me'yoriy-huquqiy bazani amalda ishlaydigan mexanizmlar bilan mustahkamlash; barcha bosqichlar uchun inklyuziv ta'limga tayyor pedagoglar tayyorlash; hududlarda resurs markazlari va erta aralashuv xizmatlarini kengaytirish; maktab binolarini bosqichma-bosqich qulaylashtirish; yagona va ishonchli ma'lumotlar tizimini yaratish.`],[`Jamiyat va fan`,`Jamiyatda stereotiplarni kamaytirish, ota-onalar va jamoat tashkilotlarining ishtirokini kuchaytirish, mahalliy sharoitga mos tadqiqotlar olib borish va xalqaro tajribani tanqidiy moslashtirish istiqbolli yo'nalishlardir. Inklyuziya - bir martalik loyiha emas, uzluksiz takomillashadigan jarayon.`]],
[[`Resurs markazi`,`Metodik va maslahat yordami ko'rsatuvchi muassasa`],[`Mexanizm`,`Qonun normalarini amalga oshirish tartibi`],[`Takomillashuv`,`Uzluksiz yaxshilanish jarayoni`]],
[[`Inklyuziya bir martalik loyihadir.`,0],[`Kadrlar tayyorlash istiqbolli yo'nalish.`,1],[`Xalqaro tajriba tanqidiy moslashtirilishi lozim.`,1]],
[[`Resurs markazi nima qiladi?`,`Metodik va maslahat yordami beradi`,`Imtihon o'tkazadi`,`Bino quradi`],[`Inklyuziya qanday jarayon?`,`Uzluksiz takomillashuvchi`,`Bir martalik`,`Tugallangan`],[`Xalqaro tajriba bilan qanday ishlanadi?`,`Tanqidiy moslashtiriladi`,`Ko'r-ko'rona ko'chiriladi`,`Rad etiladi`]]),
E(`Yakuniy loyiha: inklyuziv maktab modeli`,
[[`Loyiha topshirig'i`,`O'rgangan bilimlaringiz asosida o'z hududingiz sharoitiga mos inklyuziv maktab modelini loyihalang. Model quyidagi komponentlarni o'z ichiga olishi kerak: <b>siyosat va qadriyatlar</b> (maktab missiyasi), <b>muhit</b> (jismoniy va psixologik qulaylik), <b>kadrlar</b> (rollar va tayyorgarlik), <b>o'quv jarayoni</b> (UDL, differensiatsiya, IEP), <b>baholash</b>, <b>oila va jamoa bilan hamkorlik</b>, <b>monitoring va moliyalashtirish</b>.`],[`Baholash mezonlari`,`Model aniq, amalga oshirilishi mumkin va resurslarga mosligi; manbalarga asoslanganligi; qamrab olinadigan o'quvchilar xilma-xilligi; monitoring ko'rsatkichlarining aniqligi; ilovada qisqa taqdimot va amalga oshirish rejasi bo'lishi.`]],
[[`Model`,`Tizimning soddalashtirilgan, tizimli ifodasi`],[`Komponent`,`Modelning tarkibiy qismi`],[`Amalga oshirish rejasi`,`Bosqichlar, mas'ullar va muddatlar ko'rsatilgan reja`]],
[[`Inklyuziv maktab modeli faqat binoni o'z ichiga oladi.`,0],[`Modelda monitoring bo'lishi kerak.`,1],[`Loyiha resurslarga mos bo'lishi zarur.`,1]],
[[`Modelning komponentlaridan biri?`,`Monitoring`,`Reklama`,`Sport`],[`Loyiha nimaga mos bo'lishi kerak?`,`Resurslarga`,`Tasodifga`,`Modaga`],[`Amalga oshirish rejasida nima bo'ladi?`,`Bosqich, mas'ul, muddat`,`Faqat sarlavha`,`Faqat rasm`]])
];
function E(t,s,w,q,z){return{t,s,w,q,z}}
const titles=T.map(x=>x.t);
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
let S={g:{}};try{S=JSON.parse(ls("ik2")||"")||S}catch(e){}
const save=()=>ls("ik2",JSON.stringify(S));
const sh=a=>[...a].sort(()=>Math.random()-.5);
const toast=m=>{const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t._t);t._t=setTimeout(()=>t.style.display="none",2400)};
const gd=i=>(S.g[i]||[]).length;
const doneN=()=>T.filter((_,i)=>gd(i)>=3).length;
const nb=(a,b)=>String(b).length&&a;
function home(){
$("#xp").textContent="Bajarildi: "+doneN()+" / "+T.length;
$("#app").innerHTML=`<section class="hero"><h1>Inklyuziv ta'lim: hamma uchun maktab</h1><p>Inklyuziv ta'limning nazariy asoslari, xalqaro va milliy amaliyoti bo'yicha o'quv platformasi. Har bir mavzu dars materiali, tushunchalarni juftlash, tasdiqlarni tekshirish va test mashqlaridan iborat.</p><p><b>${T.length} mavzu</b> &middot; <b>3 turdagi mashq</b> &middot; <b>bajarilgan: ${doneN()}</b></p></section>
<main><h2 class="sec">Mavzular</h2><div class="grid">${titles.map((t,i)=>`<button class="cd ${gd(i)>=3?"dn":""}" data-i="${i}"><span class="n">${i+1}-mavzu${gd(i)>=3?" &middot; bajarildi":""}</span><b>${t}</b><div class="bar"><i style="width:${Math.min(100,gd(i)/3*100)}%"></i></div></button>`).join("")}</div></main>`;
$$(".cd").forEach(b=>b.onclick=()=>topic(+b.dataset.i));window.scrollTo(0,0)}
function topic(i){const x=T[i];
$("#app").innerHTML=`<main><button class="back" id="bk">&larr; Mavzular ro'yxati</button><h1 style="margin:6px 0 4px">${i+1}. ${x.t}</h1><div class="bar"><i style="width:${Math.min(100,gd(i)/3*100)}%"></i></div><p class="note">Mashqlar: ${gd(i)} / 3 bajarildi</p>
${x.s.map(([h,p])=>`<div class="bx"><h3>${h}</h3><p style="margin:0">${p}</p></div>`).join("")}
<h2 class="sec">Mashqlar</h2><div class="tabs"><button data-g="m" class="on">Juftlash</button><button data-g="t">Tasdiqni tekshirish</button><button data-g="z">Test</button></div><div class="gm" id="gm"></div>
${F[i]?`<h2 class="sec">Rasmiy test</h2><p>Mashqlardan so'ng rasmiy bilim testini topshiring.</p><button class="pr" id="ft">Rasmiy testni boshlash</button>`:""}</main>`;
$("#bk").onclick=home;if(F[i])$("#ft").onclick=()=>window.open(F[i],"_blank","noopener");
$$(".tabs button").forEach(b=>b.onclick=()=>{$$(".tabs button").forEach(y=>y.classList.remove("on"));b.classList.add("on");game(i,b.dataset.g)});
game(i,"m");window.scrollTo(0,0)}
function fin(i,g){const a=S.g[i]||(S.g[i]=[]);if(!a.includes(g)){a.push(g);save();$$(".bar i").forEach(b=>b.style.width=Math.min(100,a.length/3*100)+"%");const n=$(".note");if(n)n.textContent="Mashqlar: "+a.length+" / 3 bajarildi";if(a.length>=3)toast("Mavzu bajarildi")}}
function game(i,g){const x=T[i],B=$("#gm");
if(g==="m"){const w=x.w;let pick=null,ok=0;const L=sh(w.map((p,k)=>[p[0],k])),R=sh(w.map((p,k)=>[p[1],k]));
B.innerHTML=`<p>Termin va uning ta'rifini juftlang.</p><div class="mt"><div style="display:grid;gap:10px">${L.map(a=>`<button data-s="l" data-k="${a[1]}">${a[0]}</button>`).join("")}</div><div style="display:grid;gap:10px">${R.map(a=>`<button data-s="r" data-k="${a[1]}">${a[0]}</button>`).join("")}</div></div>`;
$$("#gm .mt button").forEach(b=>b.onclick=()=>{if(b.classList.contains("ok"))return;
if(!pick||pick.dataset.s===b.dataset.s){$$("#gm .sel").forEach(e=>e.classList.remove("sel"));b.classList.add("sel");pick=b;return}
if(pick.dataset.k===b.dataset.k){pick.className=b.className="ok";pick=null;if(++ok===w.length){fin(i,"m");toast("Mashq bajarildi")}}
else{const p=pick;[p,b].forEach(e=>{e.classList.add("no");setTimeout(()=>e.classList.remove("no","sel"),500)});pick=null}})}
else if(g==="t"){let k=0,sc=0;const Q=sh(x.q);const step=()=>{if(k>=Q.length){B.innerHTML=`<div class="cs">Natija: ${sc} / ${Q.length}</div><button class="pr" id="rp">Qayta urinish</button>`;fin(i,"t");$("#rp").onclick=()=>game(i,"t");return}
B.innerHTML=`<small>${k+1} / ${Q.length}</small><div class="cs">${Q[k][0]}</div><div class="op"><button data-v="1">To'g'ri</button><button data-v="0">Noto'g'ri</button></div>`;
$$("#gm .op button").forEach(b=>b.onclick=()=>{const c=+b.dataset.v===Q[k][1];b.classList.add(c?"ok":"no");if(c)sc++;$$("#gm .op button").forEach(e=>e.disabled=true);setTimeout(()=>{k++;step()},1000)})};step()}
else{let k=0,sc=0;const Q=x.z;const step=()=>{if(k>=Q.length){B.innerHTML=`<div class="cs">Natija: ${sc} / ${Q.length}</div><button class="pr" id="rp">Qayta urinish</button>`;fin(i,"z");$("#rp").onclick=()=>game(i,"z");return}
const q=Q[k],o=sh(q.slice(1).map((t,j)=>[t,j===0]));B.innerHTML=`<small>${k+1} / ${Q.length}</small><div class="cs">${q[0]}</div><div class="op">${o.map((a,j)=>`<button data-c="${a[1]?1:0}">${a[0]}</button>`).join("")}</div>`;
$$("#gm .op button").forEach(b=>b.onclick=()=>{const c=b.dataset.c==="1";b.classList.add(c?"ok":"no");if(c)sc++;else $$("#gm .op button").find(e=>e.dataset.c==="1").classList.add("ok");$$("#gm .op button").forEach(e=>e.disabled=true);setTimeout(()=>{k++;step()},1200)})};step()}}
$("#lg").onclick=home;
$("#a1").onclick=()=>{S.fs=Math.max(14,(S.fs||17)-1);document.documentElement.style.setProperty("--fs",S.fs+"px");save()};
$("#a2").onclick=()=>{S.fs=Math.min(24,(S.fs||17)+1);document.documentElement.style.setProperty("--fs",S.fs+"px");save()};
$("#hc").onclick=()=>{S.hc=!S.hc;document.documentElement.dataset.c=S.hc?"hc":"";save()};
if(S.fs)document.documentElement.style.setProperty("--fs",S.fs+"px");if(S.hc)document.documentElement.dataset.c="hc";
home();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js')
      .then(reg => console.log('Service Worker ro\'yxatdan o\'tdi:', reg.scope))
      .catch(err => console.error('Service Worker xatosi:', err));
  });
}
</script>
</body>
</html>
